<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="15">
  <title>Widget</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <img id="wall" src="widget.png" alt="Widget">

<script>
setInterval(() => {
  const img = document.getElementById("wall");
  img.src = "widget.png?t=" + new Date().getTime();
}, 5000);
</script>
</body>
</html>
